[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-scout"
version = "0.1.0"
description = "proactive scout engine first release"
requires-python = ">=3.10"
dependencies = []          

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
iris-scout = "iris_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_scout = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
